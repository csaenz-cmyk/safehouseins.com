<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>H3</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css"><style>
.hero{padding:16px 22px 30px;text-align:center;position:relative;overflow:hidden;min-height:700px;background:#fff}
.mark{width:158px;margin:6px auto 0;display:block;filter:drop-shadow(0 22px 34px rgba(22,102,237,.32))}
h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;font-weight:900;color:var(--navy);margin-top:16px}
h1 em{font-style:normal;color:var(--blue)}
.sub{font-size:14.5px;color:var(--muted);margin-top:10px}
.acts{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}
.grid div{background:var(--ice);border-radius:15px;padding:13px 8px}
.grid div svg{color:var(--blue);font-size:20px}
.grid div b{display:block;font-size:12.5px;font-weight:800;color:var(--navy);margin-top:6px}
.tr{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.9}
.tr b{color:var(--navy)}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
<symbol id="ph" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h2l2 5-2 1a11 11 0 0 0 5 5l1-2 5 2v2a2 2 0 0 1-2 2A16 16 0 0 1 4 5z"/></symbol>
<symbol id="ar" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="car" viewBox="0 0 24 24"><path d="M3 13l1.6-4.2A2 2 0 0 1 6.5 7.5h11a2 2 0 0 1 1.9 1.3L21 13M4 13h16v4a1 1 0 0 1-1 1h-1.5M6.5 18H5a1 1 0 0 1-1-1v-4"/><circle cx="7.5" cy="18" r="1.6"/><circle cx="16.5" cy="18" r="1.6"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6M6 10v9h12v-9M10 19v-5h4v5"/></symbol>
<symbol id="biz" viewBox="0 0 24 24"><path d="M4 20V8l7-4 7 4v12M4 20h16M9 20v-4h4v4"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
</svg>
<div class="nav"><img src="safehouse-logo.png" alt="Safe House Insurance">
<div class="nb"><span class="tel"><svg class="i"><use href="#ph"/></svg></span><span class="bg"><i></i><i></i><i></i></span></div></div>
<div class="hero">
  <img class="mark" src="safehouse-heart.png" alt="">
  <h1>Somebody in El Paso<br>who <em>actually</em> has<br>your back.</h1>
  <p class="sub">A licensed independent agency. We shop our carriers for you and stay on your file after the sale.</p>
  <div class="acts">
    <div class="btn">Get my free quote <svg class="i"><use href="#ar"/></svg></div>
    <div class="btn out"><svg class="i"><use href="#ph"/></svg> Call 915-503-1207</div>
  </div>
  <div class="grid">
    <div><svg class="i"><use href="#car"/></svg><b>Auto</b></div>
    <div><svg class="i"><use href="#home"/></svg><b>Home</b></div>
    <div><svg class="i"><use href="#biz"/></svg><b>Business</b></div>
  </div>
  <div class="tr"><span class="stars">★★★★★</span> <b>5-star Google reviews</b><br><b>Se habla español</b> · Licensed TX &amp; NM</div>
</div>
</body></html>
