<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>H2</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css"><style>
.nav.dk{background:var(--navy2)}   /* nav must be dark for the inverted logo to show */

.hero{background:var(--navy2);color:#fff;padding:44px 22px 44px;text-align:center;position:relative;overflow:hidden;min-height:700px}
.hero::before{content:"";position:absolute;inset:0;background:
   radial-gradient(320px 240px at 12% -4%,rgba(22,102,237,.75),transparent 62%),
   radial-gradient(300px 260px at 92% 10%,rgba(0,194,255,.36),transparent 62%),
   radial-gradient(340px 260px at 55% 112%,rgba(74,144,255,.42),transparent 62%)}
.in{position:relative}
.eb{display:inline-flex;align-items:center;gap:7px;background:rgba(0,194,255,.14);border:1px solid rgba(0,194,255,.36);
    color:#8CE3FF;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    padding:7px 13px;border-radius:999px;font-weight:600}
.eb i{width:5px;height:5px;border-radius:50%;background:var(--cyan);display:block}
h1{font-size:29px;line-height:1.12;letter-spacing:-.028em;font-weight:800;margin-top:16px;color:#cfe0fb}
.big{display:block;font-size:44px;line-height:1.04;font-weight:900;letter-spacing:-.045em;margin-top:6px;color:#fff}
.tapbox{margin-top:26px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 30px 60px -28px rgba(0,0,0,.7)}
.tapbox .lb{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tapbox .num{font-size:36px;font-weight:900;letter-spacing:-.035em;color:var(--navy);margin-top:6px;line-height:1}
.tapbox .btn{margin-top:14px}
.tapbox .es{font-size:12.5px;color:var(--muted);margin-top:11px;font-weight:600}
.or{display:flex;align-items:center;gap:12px;margin:20px 0;color:#7f9ac6;font-size:12px;font-family:'Geist Mono',monospace}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.18)}
.alt{background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.2);border-radius:16px;padding:15px;
     font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:9px}
.tr{margin-top:26px;font-size:13px;color:#a9bcd9;line-height:1.9}
.tr b{color:#fff}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
<symbol id="ph" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h2l2 5-2 1a11 11 0 0 0 5 5l1-2 5 2v2a2 2 0 0 1-2 2A16 16 0 0 1 4 5z"/></symbol>
<symbol id="ar" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="car" viewBox="0 0 24 24"><path d="M3 13l1.6-4.2A2 2 0 0 1 6.5 7.5h11a2 2 0 0 1 1.9 1.3L21 13M4 13h16v4a1 1 0 0 1-1 1h-1.5M6.5 18H5a1 1 0 0 1-1-1v-4"/><circle cx="7.5" cy="18" r="1.6"/><circle cx="16.5" cy="18" r="1.6"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6M6 10v9h12v-9M10 19v-5h4v5"/></symbol>
<symbol id="biz" viewBox="0 0 24 24"><path d="M4 20V8l7-4 7 4v12M4 20h16M9 20v-4h4v4"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
</svg>
<div class="nav dk"><img src="safehouse-logo.png" alt="Safe House Insurance">
<div class="nb"><span class="tel"><svg class="i"><use href="#ph"/></svg></span><span class="bg"><i></i><i></i><i></i></span></div></div>
<div class="hero"><div class="in">
  <span class="eb"><i></i> Open now · El Paso, TX</span>
  <h1>Talk to a licensed<br>local agent.
    <span class="big">No phone trees.<br>No waiting.</span>
  </h1>
  <div class="tapbox">
    <div class="lb">Tap to call</div>
    <div class="num">915-503-1207</div>
    <div class="btn"><svg class="i"><use href="#ph"/></svg> Call now</div>
    <div class="es">🇲🇽 Se habla español · Licensed TX &amp; NM</div>
  </div>
  <div class="or">OR</div>
  <div class="alt">Request a quote online <svg class="i"><use href="#ar"/></svg></div>
  <div class="tr"><span class="stars">★★★★★</span> <b>5-star Google reviews</b><br>Auto · Home · Commercial · Life · Bonds</div>
</div></div>
</body></html>
