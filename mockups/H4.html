<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<link rel="stylesheet" href="base.css"><style>
.hero{padding:18px 0 0;background:linear-gradient(180deg,#fff,var(--ice));min-height:700px;position:relative;overflow:hidden}
.tx{padding:0 22px}

    font-size:10px;letter-spacing:.11em;text-transform:uppercase;padding:7px 13px;border-radius:999px;font-weight:600}
h1{font-size:36px;line-height:1.04;letter-spacing:-.035em;font-weight:900;color:var(--navy);margin-top:14px}
.sub{font-size:15.5px;color:var(--muted);margin-top:12px}
.acts{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.tr{margin-top:16px;font-size:13px;color:var(--muted)}
.tr b{color:var(--navy)}
.art{margin-top:14px;position:relative;height:224px}
.art svg{position:absolute;bottom:0;left:0;width:100%;height:224px}
