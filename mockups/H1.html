<link rel="stylesheet" href="base.css"><style>
.hero{padding:52px 22px 40px;text-align:center;background:linear-gradient(180deg,var(--ice),#fff 70%);min-height:700px}
.eb{font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
h1{font-size:37px;line-height:1.04;letter-spacing:-.035em;font-weight:900;color:var(--navy);margin-top:12px}
.sub{font-size:15.5px;color:var(--muted);margin-top:12px}
.sbox{margin-top:26px;background:#fff;border:2px solid var(--ice2);border-radius:20px;padding:8px 8px 8px 18px;
      display:flex;align-items:center;gap:10px;box-shadow:0 20px 44px -26px rgba(10,33,72,.45)}
.sbox svg{color:var(--blue);font-size:21px;flex:0 0 auto}
.sbox .z{flex:1;text-align:left;font-size:19px;font-weight:800;color:var(--navy)}
.sbox .go{width:48px;height:48px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.hint{font-size:12.5px;color:var(--muted);margin-top:12px}
.tags{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.tags span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;color:#3d4a60}
.tags span b{color:var(--blue)}
.foot{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot b{color:var(--navy)}
</style></head><body>
