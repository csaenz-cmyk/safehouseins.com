<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="mockup" content="1226x1300">
<title>Step 4 — switch complete</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=block">
<link rel="stylesheet" href="mockups.css">
<style>
  .art { width: 1226px; height: 1300px; }
  /* the phone carries on below the sheet, faint */
  .phone { left: 85.35px; top: -.95px; width: 1024.37px; height: 1395px;
    --bezel: 23.4px; --ring: 8.9px; --radius: 133px; --ring-radius: 112.5px; --screen-radius: 100px;
    -webkit-mask-image: linear-gradient(to bottom, #000 1001px, rgba(0,0,0,.165) 1085px, rgba(0,0,0,.03) 1297px, transparent 1346px);
            mask-image: linear-gradient(to bottom, #000 1001px, rgba(0,0,0,.165) 1085px, rgba(0,0,0,.03) 1297px, transparent 1346px); }
  .island { left: 322.6px; top: 30.57px; width: 315px; height: 89.64px; border-radius: 45px; }

  .s4mark { left: 63.39px; top: 145.74px; width: 64.57px; height: 64.57px; }
  .nav { position: absolute; right: 63.7px; top: 150.78px; display: flex; gap: 43.4px; white-space: nowrap;
    font-size: 39.6px; font-weight: 530; letter-spacing: -.2px; line-height: normal; color: #878d98; }

  /* behind the badge, on the screen: a wide faint glow, the dashed orbit and its dot */
  .haze { position: absolute; left: 149.35px; top: 180.55px; width: 660px; height: 660px;
    background: radial-gradient(circle closest-side, rgba(27,104,233,.035) 165px, rgba(27,104,233,.025) 180px,
      rgba(27,104,233,.015) 205px, rgba(27,104,233,.012) 240px, rgba(27,104,233,0) 330px); }
  .orbit { position: absolute; left: 154.35px; top: 375.35px; width: 648.6px; height: 648.6px; overflow: visible; }
  .odot { position: absolute; left: 456.85px; top: 371.65px; width: 21px; height: 21px; border-radius: 50%;
    background: rgba(27,104,233,.27); }
  /* confetti — under the greeting, whose letters cut into it */
  .cf { position: absolute; }
  .cf1 { left: 98.25px; top: 342.15px; width: 27.6px; height: 27.6px; border-radius: 6px; background: #1b68e9; transform: rotate(34.6deg); }
  .cf2 { left: 264.6px; top: 291.9px; width: 20.5px; height: 41.5px; border-radius: 10.25px; background: #6c9cf0; transform: rotate(-17deg); }
  .cf3 { left: 651.6px; top: 292.15px; width: 23px; height: 31px; border-radius: 11.5px; background: #95b6fa; transform: rotate(8deg); }
  .cf4 { left: 836.7px; top: 363.4px; width: 21.7px; height: 21.7px; border-radius: 50%; background: #1b68e9; }
  .greet { left: 63.35px; top: 257px; font-size: 56px; font-weight: 800; letter-spacing: -1.28px; color: #e5e8ec; }

  .sheet { left: -1px; top: 542px; width: 1196px; height: 542.5px; border-radius: 56px;
    box-shadow: 0 60px 105.2px -34.8px rgba(9, 25, 58, .25); }
  .sheet .pill { position: absolute; left: 50%; top: 127.5px; height: 83.2px; transform: translateX(calc(-50% + .5px));
    display: flex; align-items: center; padding: 0 35px 2px; border-radius: 42px; background: #e8effd;
    white-space: nowrap; font-size: 33.2px; font-weight: 800; letter-spacing: 2.4px; color: #1b68e9; }
  .sheet .welcome { position: absolute; left: 0; right: 0; top: 243.2px; text-align: center; line-height: normal;
    font-size: 60.1px; font-weight: 740; letter-spacing: -1.1px; color: #05070b; }
  .sheet .gone { position: absolute; left: 68px; width: 1060px; top: 350.5px; text-align: center; line-height: 62.5px;
    font-size: 43.5px; font-weight: 500; letter-spacing: 0; color: #666d7a; }

  /* the badge sits on the sheet's top edge: rings and glow, the disc, the mark */
  .rings { position: absolute; left: 357px; top: 301.9px; width: 480px; height: 480px;
    background: radial-gradient(circle closest-side, rgba(27,104,233,.375) 102px, rgba(27,104,233,.33) 122.5px,
      rgba(27,104,233,.31) 123.6px, rgba(27,104,233,.18) 124.6px, rgba(27,104,233,.13) 154px,
      rgba(27,104,233,.045) 155.2px, rgba(27,104,233,.03) 165px, rgba(27,104,233,.022) 180px,
      rgba(27,104,233,.012) 200px, rgba(27,104,233,0) 232px); }
  .disc { position: absolute; left: 494.5px; top: 439.4px; width: 205px; height: 205px; border-radius: 50%;
    background: linear-gradient(135deg, #3e84f0 14.6%, #246eea 50%, #1659cf 85.4%); }
  .s4badge { left: 548.55px; top: 493.1px; width: 97.9px; height: 97.9px; }
</style>
</head>
<body>
<div class="art">
  <div class="phone"><div class="ring"><div class="screen">
    <div class="island"></div>
    <img class="mark s4mark" src="../../assets/safehouse-heart.png" alt="">
    <div class="nav"><span>[[art.step4.refer]]</span><span>[[art.step4.help]]</span></div>
    <div class="haze"></div>
    <svg class="orbit" viewBox="0 0 648.6 648.6" aria-hidden="true"><circle cx="324.3" cy="324.3" r="322.3" fill="none"
      stroke="#dae3f2" stroke-width="2" stroke-dasharray="6.8 3.83" stroke-dashoffset="2.05"/></svg>
    <div class="odot"></div>
    <div class="cf cf1"></div><div class="cf cf2"></div><div class="cf cf3"></div><div class="cf cf4"></div>
    <div class="t greet">[[art.step4.greeting]]</div>
  </div></div></div>

  <div class="sheet">
    <div class="pill">[[art.step4.done]]</div>
    <div class="welcome">[[art.step4.welcome]]</div>
    <div class="gone">[[art.step4.cancelled]]</div>
  </div>

  <div class="rings"></div>
  <div class="disc"></div>
  <img class="mark white s4badge" src="../../assets/safehouse-heart.png" alt="">
</div>
</body>
</html>
